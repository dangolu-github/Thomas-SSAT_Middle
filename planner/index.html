<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" href="data:,">
  <title>自学规划 | Thomas SSAT</title>
  <link rel="stylesheet" href="../assets/portal.css">
  <script src="../assets/planner-data.js"></script>
  <script src="../assets/portal.js" defer></script>
  <script src="../assets/self-study.js" defer></script>
</head>
<body data-page="planner" data-access="required">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="subpage-shell">
    <header class="subpage-nav">
      <a class="brand brand-inline" href="../"><span class="brand-mark" aria-hidden="true">T</span><span><strong>Thomas SSAT</strong><small>学习空间</small></span></a>
      <nav aria-label="课程导航"><a href="../">课程首页</a><a href="../learning/">学习方法</a><a href="../practice/">作业与模考</a><a href="../review/">错题复盘</a><a class="is-active" href="./" aria-current="page">自学规划</a></nav>
      <button class="icon-button" type="button" data-theme-toggle aria-label="切换配色">配色</button>
    </header>

    <main id="main" class="subpage-main">
      <header class="page-intro">
        <p class="eyebrow">自学规划</p>
        <h1>按周查看每项自学任务。</h1>
        <p>每周可以单独展开或收起。课前任务按实际上课日期标注，课后生词也使用对应课堂当天的日期；Mock 保留独立截止时间。</p>
      </header>

      <p class="planner-notice"><strong>状态说明：</strong>“当前已布置”和“已安排”可以完成后勾选；“待发布”与“按错题开放”在材料开放前不需要完成。勾选只表示自学任务已做。</p>

      <section class="planner-toolbar" aria-label="计划操作">
        <p class="planner-meter" data-study-meter aria-live="polite">已完成 0 / 0</p>
        <div class="planner-actions">
          <button class="button button-secondary" type="button" data-study-expand>展开全部</button>
          <button class="button button-secondary" type="button" data-study-collapse>收起全部</button>
          <button class="button button-primary" type="button" data-study-save>保存进度</button>
          <button class="button button-secondary" type="button" data-study-clear>清除全部勾选</button>
        </div>
        <p class="planner-status" data-study-status aria-live="polite"></p>
      </section>

      <div class="week-grid" data-study-weeks></div>
    </main>
    <footer class="site-footer"><a href="../">返回课程首页</a><button type="button" class="text-button" data-print>打印或保存 PDF</button></footer>
  </div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="data:,">
  <title>Mock 答题卡 | Thomas SSAT</title>
  <link rel="stylesheet" href="../../assets/portal.css"><link rel="stylesheet" href="../../assets/homework.css">
  <script src="../../assets/planner-data.js"></script><script src="../../assets/mock-data.js"></script><script src="../../assets/portal.js" defer></script><script src="../../assets/self-study.js" defer></script><script src="../../assets/mock-exam.js" defer></script>
</head>
<body data-page="practice" data-access="required">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="subpage-shell">
    <header class="subpage-nav">
      <a class="brand brand-inline" href="../../"><span class="brand-mark" aria-hidden="true">T</span><span><strong>Thomas SSAT</strong><small>学习空间</small></span></a>
      <nav aria-label="课程导航"><a href="../../">课程首页</a><a href="../../learning/">学习方法</a><a class="is-active" href="../" aria-current="page">作业与模考</a><a href="../../review/">错题复盘</a><a href="../../planner/">自学规划</a></nav>
      <button class="icon-button" type="button" data-theme-toggle aria-label="切换配色">配色</button>
    </header>
    <main id="main" class="subpage-main">
      <header class="page-intro">
        <p class="eyebrow" data-mock-label>Mock</p><h1 data-mock-title>Reading + Verbal</h1>
        <dl class="mock-meta"><div><dt>截止时间</dt><dd data-mock-due></dd></div><div><dt>Reading</dt><dd>40分钟 · 40题</dd></div><div><dt>Verbal</dt><dd>30分钟 · 60题</dd></div></dl>
        <p data-mock-source></p><a class="task-link" data-mock-source-link target="_blank" rel="noopener">打开试卷来源</a>
      </header>
      <p class="assignment-note"><strong>开始前：</strong>打开老师单独提供的对应私密学生试卷。点击某一部分的“开始”后立即计时；计时结束会锁定该部分。全部完成后点击“正式提交答题卡”。</p>
      <section class="timer-grid" aria-label="分科计时">
        <article class="timer-card"><span>Reading</span><strong data-timer="reading">40:00</strong><button class="button button-secondary" type="button" data-start-timer="reading">开始 Reading</button></article>
        <article class="timer-card"><span>Verbal</span><strong data-timer="verbal">30:00</strong><button class="button button-secondary" type="button" data-start-timer="verbal">开始 Verbal</button></article>
      </section>
      <div class="assignment-toolbar">
        <p class="assignment-status" data-mock-status aria-live="polite">准备好试卷后开始计时。</p>
        <div class="assignment-actions"><button class="button button-secondary" type="button" data-save-mock>保存答题卡</button><button class="button button-primary" type="button" data-submit-mock>正式提交答题卡</button></div>
        <p class="submission-receipt" data-mock-receipt aria-live="polite"></p>
      </div>
      <form data-mock-form>
        <fieldset class="mock-section" data-section-fieldset="reading" disabled><legend data-reading-label>Reading 1–40</legend><div class="answer-grid" data-answer-grid="reading"></div></fieldset>
        <fieldset class="mock-section" data-section-fieldset="verbal" disabled><legend data-verbal-label>Verbal 1–60</legend><div class="answer-grid" data-answer-grid="verbal"></div></fieldset>
      </form>
    </main>
    <footer class="site-footer"><a href="./">返回 Mock 列表</a><button type="button" class="text-button" data-print>打印空白答题卡</button></footer>
  </div>
</body>
</html>

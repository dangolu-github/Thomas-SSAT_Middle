<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="data:,">
  <title>错题本 | Thomas SSAT</title>
  <link rel="stylesheet" href="../../assets/portal.css"><link rel="stylesheet" href="../../assets/homework.css">
  <link rel="stylesheet" href="../../assets/mistake-review.css?v=20260909-3">
  <script src="../../assets/portal.js" defer></script><script src="../../assets/mistake-log.js?v=20260909-3" defer></script>
</head>
<body data-page="review" data-access="review-auth">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="subpage-shell">
    <header class="subpage-nav">
      <a class="brand brand-inline" href="../../"><span class="brand-mark" aria-hidden="true">T</span><span><strong>Thomas SSAT</strong><small>学习空间</small></span></a>
      <nav aria-label="课程导航"><a href="../../">课程首页</a><a href="../../learning/">学习方法</a><a href="../../practice/">作业与模考</a><a class="is-active" href="../" aria-current="page">错题复盘</a><a href="../../planner/">自学规划</a></nav>
      <button class="icon-button" type="button" data-theme-toggle aria-label="切换配色">配色</button>
    </header>
    <main id="main" class="subpage-main">
      <header class="page-intro"><p class="eyebrow">Mistake Review</p><h1>按题型复习，再独立重做。</h1><p>每次正式提交后的错题和未答题会自动归入错题本。展开题目，先读原文，再选择查看答案或重做。</p></header>
      <form class="review-login" data-review-login hidden>
        <h2>打开你的错题本</h2><p>输入网站访问密码，查看已提交的作业。</p>
        <label>访问密码<input type="password" autocomplete="current-password" required></label>
        <button class="button button-primary" type="submit">打开错题本</button><p data-login-status role="status"></p>
      </form>
      <div data-review-workspace hidden>
        <section class="planner-toolbar" aria-label="错题本操作">
          <p class="planner-meter" data-mistake-meter aria-live="polite"></p>
          <div class="planner-actions"><button class="button button-primary" type="button" data-refresh-mistakes>刷新记录</button><button class="button button-secondary" type="button" data-review-lock>关闭错题本</button></div>
          <p class="planner-status" data-mistake-status aria-live="polite"></p>
        </section>
        <div class="review-filters"><label>Question type<select data-type-filter><option value="">全部题型</option></select></label><label>查看<select data-view-filter><option value="active">复习清单</option><option value="removed">已移除</option></select></label></div>
        <p>答案默认隐藏。重做后可继续保留，也可移出清单；移除的题目可以恢复。</p>
        <div class="mistake-list" data-mistake-list></div>
      </div>
    </main>
    <footer class="site-footer"><a href="../">返回错题复盘</a><button type="button" class="text-button" data-print>打印或保存 PDF</button></footer>
  </div>
</body>
</html>
